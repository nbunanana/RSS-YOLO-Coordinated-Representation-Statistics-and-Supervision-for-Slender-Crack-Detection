# 设计要点：消除 EMA 与 GN 的重复归一化
# 相对“P3 用 C2f_EMA_GN”的组合版配置，本配置把 P3 的 C2f_EMA_GN 改为 C2f_EMA。
#   - 组合版 P3：Conv_GN(外部 GroupNorm, 32组) -> EMA(内部 GroupNorm, 每组1通道)
#     同一条路径上叠了两层归一化。
#   - 本配置 P3：Conv(BatchNorm) -> EMA(内部 GroupNorm)
#     只保留 EMA 自带的那一层归一化，消除重复。
#   - P4/P5 仍为 C2f_GN，GN 只在远离 EMA 的深层使用。
# 净效果：单变量改动——"P3 是否叠加两层归一化"。
# 注意：GN 与 BN 的可训练参数量相同（均为 2C 的 weight/bias），因此本方案参数量不变。
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone (keep BatchNorm)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0n head: P3 uses EMA only (BatchNorm), P4/P5 use GroupNorm
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f_GN, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f_EMA, [256]] # 15 (P3/8-small) - EMA only, no external GN

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f_GN, [512]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f_GN, [1024]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)
