# Design note: remove the duplicated normalisation between EMA and GN
# Compared with the combined configuration that uses C2f_EMA_GN at P3, this configuration replaces the C2f_EMA_GN at P3 with C2f_EMA.
#   - Combined variant at P3: Conv_GN (external GroupNorm, 32 groups) -> EMA (internal GroupNorm, 1 channel per group)
#     two normalisation layers are stacked on the same path.
#   - This configuration at P3: Conv (BatchNorm) -> EMA (internal GroupNorm)
#     only the normalisation built into EMA is retained, which removes the duplication.
#   - P4/P5 remain C2f_GN, so GN is used only in the deeper layers far from EMA.
# Net effect: a single-variable change, namely whether P3 stacks two normalisation layers.
# Note: GN and BN have the same number of trainable parameters (weight and bias of size 2C in both cases), so the parameter count of this design is unchanged.
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone (keep BatchNorm)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0n head: P3 uses EMA only (BatchNorm), P4/P5 use GroupNorm
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f_GN, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f_EMA, [256]] # 15 (P3/8-small) - EMA only, no external GN

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f_GN, [512]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f_GN, [1024]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)
