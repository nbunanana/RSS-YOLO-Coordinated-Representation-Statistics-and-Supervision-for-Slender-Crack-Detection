# Ablation control: **EMA (P3 only) plus mask auxiliary supervision, with GN removed**.
# Structurally identical **line by line** to yolov8-ema-crack-nodup-seg.yaml, with a single change: `C2f_GN` at layers 12/18/21 becomes `C2f` (P4/P5 revert to standard BN).
# Purpose: to check whether the combined effect of the mask loss and EMA is retained once GN is removed.
#   CRACK_SEG_W=1.0 -> EMA + mask (this configuration)
#   CRACK_SEG_W=0   -> EMA only (control; **bit-identical parameter count** to this configuration)
# Control relationships:
#   the difference between the two configurations -> the effect of the mask term within this family
# Use of the control: comparison with the GN-containing recipe, used to judge the contribution of GN (paired comparison with matched seeds).
# Fairness (Section 5.3 of the paper): all control configurations use pretrained=yolov8n.pt; box metrics are always reported in the DetectionValidator convention.
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/segment

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone (keep BatchNorm)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0n head: P3 uses EMA; P4/P5 use **standard C2f (BN)** (GN is removed relative to the three-component variant)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[10, 6], 1, Concat, [1]] # 11 cat backbone P4 (explicit absolute index)
  - [-1, 3, C2f, [512]] # 12  previously C2f_GN, now standard C2f

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[13, 4], 1, Concat, [1]] # 14 cat backbone P3 (explicit absolute index)
  - [-1, 3, C2f_EMA, [256]] # 15 (P3/8-small) - EMA only

  - [-1, 1, Conv, [256, 3, 2]] # 16
  - [[16, 12], 1, Concat, [1]] # 17 cat head P4 (explicit absolute index)
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium) previously C2f_GN, now standard C2f

  - [-1, 1, Conv, [512, 3, 2]] # 19
  - [[19, 9], 1, Concat, [1]] # 20 cat head P5 (explicit absolute index)
  - [-1, 3, C2f, [1024]] # 21 (P5/32-large) previously C2f_GN, now standard C2f

  - [[15, 18, 21], 1, Segment, [nc, 32, 256]] # Segment(P3, P4, P5); proto is taken from P3 (CRACK_PROTO_LVL=0)
