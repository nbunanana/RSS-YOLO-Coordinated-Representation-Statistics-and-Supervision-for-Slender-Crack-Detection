# 消融对照：**EMA(仅 P3) + 掩膜辅助监督，去掉 GN**。
# 与 yolov8-ema-crack-nodup-seg.yaml **逐行同构**，唯一改动：层 12/18/21 的 `C2f_GN` → `C2f`（P4/P5 回到标准 BN）。
# 目的：核对去掉 GN 后，掩膜 + EMA 的组合效果是否保持。
#   CRACK_SEG_W=1.0 → EMA + 掩膜（本臂）
#   CRACK_SEG_W=0   → 仅 EMA（对照；与本臂**参数量逐位一致**）
# 对照关系：
#   两臂之差 → 本家族内的【掩膜】效应
# 对照用途：与含 GN 的配方比较，用于判断 GN 的贡献（同 seed 配对比较）。
# 公平性（§5.3）：所有对照配置统一 pretrained=yolov8n.pt；box 指标一律 DetectionValidator 口径。
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/segment

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone (keep BatchNorm)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0n head: P3 用 EMA；P4/P5 用**标准 C2f（BN）**（相对三组件版去掉了 GN）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[10, 6], 1, Concat, [1]] # 11 cat backbone P4（显式绝对索引）
  - [-1, 3, C2f, [512]] # 12  ← 原 C2f_GN，现为标准 C2f

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[13, 4], 1, Concat, [1]] # 14 cat backbone P3（显式绝对索引）
  - [-1, 3, C2f_EMA, [256]] # 15 (P3/8-small) - EMA only

  - [-1, 1, Conv, [256, 3, 2]] # 16
  - [[16, 12], 1, Concat, [1]] # 17 cat head P4（显式绝对索引）
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium) ← 原 C2f_GN，现为标准 C2f

  - [-1, 1, Conv, [512, 3, 2]] # 19
  - [[19, 9], 1, Concat, [1]] # 20 cat head P5（显式绝对索引）
  - [-1, 3, C2f, [1024]] # 21 (P5/32-large) ← 原 C2f_GN，现为标准 C2f

  - [[15, 18, 21], 1, Segment, [nc, 32, 256]] # Segment(P3, P4, P5)；proto 取 P3（CRACK_PROTO_LVL=0）
