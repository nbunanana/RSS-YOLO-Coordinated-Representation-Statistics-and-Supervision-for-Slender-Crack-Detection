# 本臂 = EMA+GN 检测配方 + 掩膜辅助监督：Neck 结构与 yolov8-ema-crack-nodup.yaml 逐层一致，
# 仅把最后的 Detect 替换为 Segment（[nc, 32, 256]），即新增 cv4 掩膜系数分支与 proto 原型分支，
# 损失侧由 v8SegmentationLoss 增加掩膜监督项（框/分类损失不变）。
#
# proto 取值（head.py 的相应改动见 overlay/）：
#   本 yaml 为 **3 尺度** Segment，proto 取自 x[0] = P3（c1 = 64）→ 用 CRACK_PROTO_LVL=0（默认）。
#   若改用 4 尺度（P2 起）的 Segment 配置，需设 CRACK_PROTO_LVL=1 使 proto 仍取自 P3；
#   该 4 尺度配置不属本代码包（非论文实验臂）。
#
# 公平性（§5.3）：所有对照配置统一 pretrained=yolov8n.pt（禁止用 yolov8n-seg.pt）；
#   box 指标一律用 DetectionValidator 口径；训练目标含掩膜损失，故本配方是"不同的训练机制"。
# 掩膜权重置零的对照组复用本 yaml，以 CRACK_SEG_W=0 断开掩膜监督（不改 hyp.box，见 loss.py 注释）。
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/segment

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-seg.yaml' will call yolov8-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone (keep BatchNorm) —— 与 yolov8-ema-crack-nodup.yaml 逐行相同
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0n head: P3 检测层用 EMA，P4/P5 检测层用 GN（Neck 内部与 nodup 完全一致）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[10, 6], 1, Concat, [1]] # 11 cat backbone P4（显式绝对索引）
  - [-1, 3, C2f_GN, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[13, 4], 1, Concat, [1]] # 14 cat backbone P3（显式绝对索引）
  - [-1, 3, C2f_EMA, [256]] # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 16
  - [[16, 12], 1, Concat, [1]] # 17 cat head P4（显式绝对索引）
  - [-1, 3, C2f_GN, [512]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 19
  - [[19, 9], 1, Concat, [1]] # 20 cat head P5（显式绝对索引）
  - [-1, 3, C2f_GN, [1024]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, Segment, [nc, 32, 256]] # Segment(P3, P4, P5)；proto 取 P3（CRACK_PROTO_LVL=0）
